<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MediResQ - Medical Records & Prescriptions</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .record-card {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      border-left: 5px solid #10b981;
      margin-top: 12px;
      border-top: 1px solid #334155;
    }
    .fee-badge {
      background: #0369a1;
      color: white;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .tablet-badge {
      background: #0f172a;
      border: 1px solid #059669;
      color: #34d399;
      padding: 6px 10px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 6px;
      font-family: monospace;
      font-size: 0.88rem;
    }
    .action-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .action-btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <a href="/" class="btn btn-secondary btn-sm" style="text-decoration: none; margin-right: 6px;">⬅️ Hub</a>
      <span style="font-size: 1.2rem;">📁</span>
      <h1>MediResQ Patient Medical Records & Prescriptions</h1>
    </div>
  </header>

  <main style="max-width: 1000px; margin: 20px auto; padding: 0 15px;">
    <!-- MANUAL RECORD FORM -->
    <section class="card">
      <h3>➕ Add Patient Record & Prescribed Tablets</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
        <input type="text" id="patientName" placeholder="Patient Full Name" value="Anita Sharma">
        <input type="text" id="doctorName" placeholder="Attending Doctor" value="Dr. Ramesh Sharma">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
        <input type="text" id="hospitalName" placeholder="Hospital / Medical Facility" value="City Trauma & Specialty Center">
        <input type="text" id="diagnosis" placeholder="Disease / Medical Diagnosis" value="Hypertension & High Cholesterol">
      </div>
      <input type="text" id="tablets" placeholder="Prescribed Tablets (e.g., Telmisartan 40mg, Atorvastatin 10mg)" value="Telmisartan 40mg (OD), Atorvastatin 10mg (HS)" style="width: 100%; margin-top: 10px; padding: 8px; background: #0f172a; color: #34d399; border: 1px solid #334155; border-radius: 4px;">
      <button class="btn btn-primary" style="margin-top: 10px; width: 100%; font-weight: bold;" onclick="addRecord()">💾 Save Patient Medical Record</button>
    </section>

    <!-- SEARCH & RECORD LIST -->
    <section class="card" style="margin-top: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>📁 Digital Medical History & Prescriptions</h3>
        <input type="text" id="searchBox" placeholder="🔍 Search patient, disease, or tablet..." onkeyup="filterRecords()" style="width: 280px; padding: 8px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px;">
      </div>
      <div id="recordsContainer" style="margin-top: 15px;"></div>
    </section>
  </main>

  <script>
    let allRecords = [];

    async function fetchRecords() {
      const res = await fetch('/api/records/list');
      allRecords = await res.json();
      renderRecords(allRecords);
    }

    function renderRecords(list) {
      if (list.length === 0) {
        document.getElementById('recordsContainer').innerHTML = '<p style="color: #94a3b8;">No records found.</p>';
        return;
      }

      let html = '';
      list.forEach((r, idx) => {
        html += `
          <div class="record-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <strong style="color: #38bdf8; font-size: 1.05rem;">ID: ${r.id} | Patient: <span style="color:#f8fafc;">${r.patientName}</span></strong>
              <div>
                <span class="fee-badge">${r.fee || '₹300'}</span>
                <span style="font-size: 0.8rem; color: #94a3b8; margin-left: 8px;">📅 ${r.date}</span>
              </div>
            </div>
            <div style="font-size: 0.88rem; color: #cbd5e1; margin-top: 8px;">
              🏥 Facility: <b>${r.hospitalName}</b> | 👨‍⚕️ Doctor: <b>${r.doctor}</b><br>
              🩺 Disease / Diagnosis: <b style="color: #f59e0b;">${r.diagnosis}</b><br>
              💊 Prescribed Tablets / Dose:
              <div class="tablet-badge">💊 ${r.tablets || r.prescription}</div>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="action-btn" onclick="exportPDF(${idx})">📥 Export Official Prescription Summary (.TXT / PDF)</button>
            </div>
          </div>
        `;
      });
      document.getElementById('recordsContainer').innerHTML = html;
    }

    function exportPDF(index) {
      const r = allRecords[index];
      const textContent = `
===================================================================
                  MEDIRESQ MEDICAL PRESCRIPTION REPORT
===================================================================
Token / Record ID : ${r.id}
Date              : ${r.date}
Patient Name      : ${r.patientName}
Attending Facility: ${r.hospitalName}
Attending Doctor  : ${r.doctor}
Registration Fee  : ${r.fee || '₹300'}
-------------------------------------------------------------------
DIAGNOSIS & MEDICAL CONDITION:
${r.diagnosis}

PRESCRIBED TABLETS & DOSAGE INSTRUCTIONS:
${r.tablets || r.prescription}
-------------------------------------------------------------------
Status            : Official Verified Digital Medical Record
System            : MediResQ Synchronized Health System
===================================================================
      `;

      const blob = new Blob([textContent], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Prescription_${r.patientName.replace(/\s+/g, '_')}_${r.id}.txt`;
      link.click();
    }

    function filterRecords() {
      const query = document.getElementById('searchBox').value.toLowerCase();
      const filtered = allRecords.filter(r => 
        r.patientName.toLowerCase().includes(query) ||
        r.diagnosis.toLowerCase().includes(query) ||
        (r.tablets && r.tablets.toLowerCase().includes(query)) ||
        r.hospitalName.toLowerCase().includes(query)
      );
      renderRecords(filtered);
    }

    async function addRecord() {
      const pat = document.getElementById('patientName').value;
      const doc = document.getElementById('doctorName').value;
      const hosp = document.getElementById('hospitalName').value;
      const diag = document.getElementById('diagnosis').value;
      const tab = document.getElementById('tablets').value;

      await fetch('/api/records/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ patientName: pat, doctor: doc, hospitalName: hosp, diagnosis: diag, tablets: tab })
      });
      fetchRecords();
    }

    window.onload = fetchRecords;
  </script>
</body>
</html>
